name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  OMP_PROC_BIND: close
  OMP_PLACES: cores

jobs:
  build-and-test:
    name: ${{ matrix.preset == 'release' && 'Release Build' || 'Build & Test' }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        preset: [ default, release ]
        include:
          - preset: default
            build-dir: build
          - preset: release
            build-dir: build-rel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up build environment
        id: setup
        uses: ./.github/actions/setup-qde
        with:
          build-dir: ${{ matrix.build-dir }}

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then
            EXTRA="-DOpenMP_ROOT=$(brew --prefix libomp)"
          fi
          cmake --preset ${{ matrix.preset }} -DANTLR4_JAR_LOCATION="${{ steps.setup.outputs.antlr-jar }}" $EXTRA

      - name: Build
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        shell: bash
        run: ctest --preset ${{ matrix.preset }}

  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up build environment
        id: setup
        uses: ./.github/actions/setup-qde
        with:
          build-dir: build-san

      - name: Configure
        run: cmake --preset sanitizers -DANTLR4_JAR_LOCATION="${{ steps.setup.outputs.antlr-jar }}"

      - name: Build
        run: cmake --build --preset sanitizers

      - name: Test
        run: ctest --preset sanitizers

  static-analysis:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-tidy
        uses: ./.github/actions/install-llvm-tools
        with:
          packages: clang-tidy-22

      - name: Set up build environment
        id: setup
        uses: ./.github/actions/setup-qde
        with:
          build-dir: build-analysis

      - name: Configure
        run: cmake --preset analysis -DANTLR4_JAR_LOCATION="${{ steps.setup.outputs.antlr-jar }}"

      - name: Build
        run: cmake --build --preset analysis

      - name: Run clang-tidy
        run: find src tests -type f -name "*.cpp" | xargs -r clang-tidy-22 -p build-analysis

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        uses: ./.github/actions/install-llvm-tools
        with:
          packages: clang-format-22

      - name: Check formatting
        run: |
          find src tests include -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \) | \
            xargs -r clang-format-22 --dry-run --Werror

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Set up build environment
        id: setup
        uses: ./.github/actions/setup-qde
        with:
          build-dir: build-cov

      - name: Configure
        run: cmake --preset coverage -DANTLR4_JAR_LOCATION="${{ steps.setup.outputs.antlr-jar }}"

      - name: Build
        run: cmake --build --preset coverage

      - name: Test
        run: ctest --preset coverage

      - name: Generate coverage report
        run: |
          lcov --capture --directory build-cov --output-file coverage.info --gcov-tool gcov --ignore-errors mismatch
          # Keep only QDE's own sources: drop system headers, tests, fetched
          # dependencies (ANTLR runtime, GoogleTest) and generated code.
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/_deps/*' '*/build-cov/*' --output-file coverage.info --ignore-errors mismatch
          genhtml coverage.info --output-directory coverage-html

      - name: Upload HTML report as artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-html/

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
