name: Install LLVM tools
description: >
  Installs packages (e.g. clang-tidy-22) from the signed apt.llvm.org
  repository. Ubuntu only.

inputs:
  version:
    description: LLVM major version.
    required: false
    default: '22'
  packages:
    description: Space-separated apt packages to install.
    required: true

runs:
  using: composite
  steps:
    - name: Add apt.llvm.org repository and install
      shell: bash
      run: |
        codename="$(lsb_release -cs)"
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
          | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
        echo "deb http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-${{ inputs.version }} main" \
          | sudo tee /etc/apt/sources.list.d/llvm-${{ inputs.version }}.list >/dev/null
        sudo apt-get update
        sudo apt-get install -y ${{ inputs.packages }}
