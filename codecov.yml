coverage:
  precision: 2                        # decimal places in reported percentages
  round: down                         # always round down, never inflate numbers
  range: "70...100"                   # color scale: red below 70, green at 100
  status:
    project:
      default:
        target: 80%
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        target: 75%
        threshold: 1%
        if_ci_failed: error

comment:
  layout: "reach,diff,flags,files"    # what appears in the PR comment
  behavior: default                   # updates existing comment instead of posting new ones
  require_changes: true               # only comments if coverage actually changed
  require_base: true                  # requires base coverage to compare against

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

ignore:
  - "tests/**"
  - "build/**"
  - "build-*/**"
  - "docs/**"